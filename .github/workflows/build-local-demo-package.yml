name: Build local demo package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-local-demo-package.yml'
      - 'index.html'
      - 'chunks/**'
      - 'integrations/**'
      - 'data/**'
      - 'assets/**'
      - 'local-companion/**'
      - 'docs/**'
      - 'templates/**'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frontend
        uses: actions/checkout@v4

      - name: Validate local companion and frontend modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile local-companion/server.py
          find integrations -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python - <<'PY'
          import json
          from pathlib import Path
          for path in list(Path('data').glob('*.json')) + list(Path('templates').glob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
              print('Validated', path)
          PY

      - name: Assemble package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME='quest-intelligence-360-local-demo'
          PACKAGE_ROOT="$RUNNER_TEMP/$PACKAGE_NAME"
          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT"
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'local-data' \
            --exclude 'downloads' \
            ./ "$PACKAGE_ROOT/"
          mkdir -p "$PACKAGE_ROOT/local-data/uploads" "$PACKAGE_ROOT/local-data/frontend-cache"
          cat > "$PACKAGE_ROOT/START-HERE.txt" <<'TXT'
          QUEST INTELLIGENCE 360 — LOCAL DEMO

          Windows:
            Double-click local-companion\run-windows.bat

          macOS/Linux:
            chmod +x local-companion/run-macos-linux.sh
            ./local-companion/run-macos-linux.sh

          The local companion opens http://127.0.0.1:8765 and stores uploaded
          files under local-data/uploads with a local SQLite index.

          For a locally synchronized SharePoint folder, add:
            --watch-folder "FULL PATH TO THE SYNCED FOLDER"

          Read local-companion/README.md before using confidential files.
          TXT
          (
            cd "$RUNNER_TEMP"
            zip -r "$GITHUB_WORKSPACE/$PACKAGE_NAME.zip" "$PACKAGE_NAME"
          )

      - name: Upload local demo ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: quest-intelligence-360-local-demo
          path: quest-intelligence-360-local-demo.zip
          retention-days: 30
          if-no-files-found: error

      - name: Publish stable downloadable ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp quest-intelligence-360-local-demo.zip downloads/quest-intelligence-360-local-demo.zip
          git config user.name 'quest-local-package[bot]'
          git config user.email 'quest-local-package[bot]@users.noreply.github.com'
          git add downloads/quest-intelligence-360-local-demo.zip
          if git diff --cached --quiet; then
            echo 'Downloadable package is already current.'
            exit 0
          fi
          git commit -m 'Publish latest downloadable local demo package'
          git pull --rebase origin main
          git push origin HEAD:main
