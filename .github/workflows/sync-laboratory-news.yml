# Public Pages bridge keeps this cross-repository sync working even when both repositories are private.
name: Sync laboratory news data

on:
  workflow_dispatch:
  schedule:
    - cron: '45 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-laboratory-news.yml'

permissions:
  contents: write

concurrency:
  group: sync-laboratory-news
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out Quest frontend
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download latest published laboratory monitor outputs
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BASE='https://atanubarik.github.io/laboratory-news-monitor'
          mkdir -p data/laboratory-knowledge assets/quest-news-icons
          : > /tmp/lab-sync-warnings.txt

          fetch_published() {
            local path="$1"
            local target="$2"
            local required="${3:-optional}"
            local tmp="${target}.incoming"
            local bust
            bust=$(date +%s)
            rm -f "$tmp"

            if curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 90 --silent --show-error \
              "$SOURCE_BASE/$path?sync=$bust" --output "$tmp"; then
              mv "$tmp" "$target"
              echo "Updated published source: $path"
              return 0
            fi

            rm -f "$tmp"
            if [ "$required" = 'required' ]; then
              echo "Required published laboratory source unavailable: $path" >&2
              exit 22
            fi
            echo "$path" >> /tmp/lab-sync-warnings.txt
            echo "Optional published source unavailable; retaining current Quest copy when present: $path"
          }

          fetch_published data/news.json data/laboratory-news.json required
          fetch_published data/email_status.json data/laboratory-email-status.json optional
          fetch_published data/workflow_health.json data/laboratory-workflow-health.json optional
          fetch_published data/chatgpt_strategic_synthesis.json data/laboratory-chatgpt-strategic-synthesis.json optional
          fetch_published data/chatgpt_summaries.json data/laboratory-chatgpt-summaries.json optional

          if ! curl --fail --location --retry 1 --connect-timeout 12 --max-time 45 --silent --show-error \
            https://laboratory-news-ai.atanu-barik.workers.dev --output data/laboratory-ai-health.json.incoming; then
            rm -f data/laboratory-ai-health.json.incoming
            if [ ! -f data/laboratory-ai-health.json ]; then
              printf '%s\n' '{"status":"optional_worker_unavailable","capabilities":[]}' > data/laboratory-ai-health.json
            fi
            echo 'cloudflare-worker-health' >> /tmp/lab-sync-warnings.txt
          else
            mv data/laboratory-ai-health.json.incoming data/laboratory-ai-health.json
          fi

          for file in manifest.json latest.md quest-diagnostics.md labcorp.md arup-laboratories.md mayo-clinic-laboratories.md sonic-healthcare.md; do
            fetch_published "knowledge/$file" "data/laboratory-knowledge/$file" optional
          done

          for icon in product-services clinical-rd partnership-ma financials organizational leadership other; do
            fetch_published "assets/email-icons/rendered/${icon}.png" "assets/quest-news-icons/${icon}.png" optional
          done

          SOURCE_VERSION=$(python - <<'PY'
          import hashlib
          from pathlib import Path
          paths = [
              Path('data/laboratory-news.json'),
              Path('data/laboratory-email-status.json'),
              Path('data/laboratory-workflow-health.json'),
              Path('data/laboratory-chatgpt-strategic-synthesis.json'),
              Path('data/laboratory-chatgpt-summaries.json'),
          ]
          digest = hashlib.sha256()
          for path in paths:
              if path.exists():
                  digest.update(path.name.encode())
                  digest.update(path.read_bytes())
          print(digest.hexdigest())
          PY
          )

          python - "$SOURCE_VERSION" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          def read_json(path, default=None):
              file = Path(path)
              if not file.exists():
                  return {} if default is None else default
              try:
                  return json.loads(file.read_text(encoding='utf-8'))
              except Exception:
                  return {} if default is None else default

          source_version = sys.argv[1]
          news = read_json('data/laboratory-news.json')
          email = read_json('data/laboratory-email-status.json')
          workflow = read_json('data/laboratory-workflow-health.json')
          strategic = read_json('data/laboratory-chatgpt-strategic-synthesis.json')
          summaries = read_json('data/laboratory-chatgpt-summaries.json')
          worker = read_json('data/laboratory-ai-health.json')
          manifest = read_json('data/laboratory-knowledge/manifest.json')
          warning_file = Path('/tmp/lab-sync-warnings.txt')
          warnings = [line.strip() for line in warning_file.read_text(encoding='utf-8').splitlines() if line.strip()] if warning_file.exists() else []

          items = news.get('items') or []
          if not isinstance(items, list):
              raise SystemExit('Synced laboratory news has an invalid items field')
          if not items:
              raise SystemExit('Published laboratory news contains no items')

          summary_records = summaries.get('summaries') or {}
          summarized_in_feed = sum(1 for item in items if item.get('chatgpt_summary'))
          version = {
              'source_repository': 'AtanuBarik/laboratory-news-monitor',
              'source_transport': 'published_github_pages_export',
              'source_version_hash': source_version,
              'synchronized_at': datetime.now(timezone.utc).isoformat(),
              'news_generated_at': news.get('generated_at'),
              'news_generated_at_display': news.get('generated_at_display'),
              'news_item_count': news.get('item_count', len(items)),
              'raw_relevant_item_count': news.get('raw_relevant_item_count'),
              'duplicates_merged': news.get('duplicates_merged'),
              'failures': news.get('failures') or [],
              'filter_policy': news.get('filter_policy'),
              'email_status': email.get('status'),
              'email_checked_at_display': email.get('checked_at_display'),
              'scheduled_chatgpt_summary_count': email.get('scheduled_chatgpt_summary_count', 0),
              'gemini_summary_count': email.get('gemini_summary_count', 0),
              'gemini_fallback_enabled': email.get('gemini_fallback_enabled'),
              'workflow_last_run_display': workflow.get('last_run_display'),
              'workflow_next_update_display': workflow.get('next_update_display'),
              'chatgpt_queue_count': workflow.get('chatgpt_queue_count'),
              'chatgpt_remaining_unsummarized': workflow.get('chatgpt_remaining_unsummarized'),
              'chatgpt_summary_record_count': len(summary_records),
              'chatgpt_summaries_in_feed': summarized_in_feed,
              'strategic_synthesis_updated_at': strategic.get('updated_at'),
              'strategic_synthesis_updated_at_display': strategic.get('updated_at_display'),
              'strategic_synthesis_provider': strategic.get('provider'),
              'worker_status': worker.get('status', 'available' if worker else 'unknown'),
              'worker_capabilities': sorted(worker.get('capabilities') or []),
              'knowledge_generated_at': manifest.get('generated_at'),
              'sync_warnings': warnings,
          }
          Path('data/laboratory-source-version.json').write_text(
              json.dumps(version, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          print(json.dumps(version, indent=2))
          PY

      - name: Commit synchronized data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'quest-intelligence-sync[bot]'
          git config user.email 'quest-intelligence-sync[bot]@users.noreply.github.com'
          git add \
            data/laboratory-news.json \
            data/laboratory-email-status.json \
            data/laboratory-workflow-health.json \
            data/laboratory-chatgpt-strategic-synthesis.json \
            data/laboratory-chatgpt-summaries.json \
            data/laboratory-ai-health.json \
            data/laboratory-source-version.json \
            data/laboratory-knowledge \
            assets/quest-news-icons
          if git diff --cached --quiet; then
            echo 'Laboratory news data is already current.'
            exit 0
          fi
          git commit -m 'Sync latest published laboratory news, summaries and workflow health'
          git pull --rebase origin main
          git push origin HEAD:main
