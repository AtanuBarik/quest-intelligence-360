name: Sync laboratory news data

on:
  workflow_dispatch:
  schedule:
    - cron: '45 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-laboratory-news.yml'

permissions:
  contents: write

concurrency:
  group: sync-laboratory-news
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Quest frontend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download latest laboratory monitor outputs
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BASE='https://raw.githubusercontent.com/AtanuBarik/laboratory-news-monitor/main'
          mkdir -p data/laboratory-knowledge assets/quest-news-icons

          curl --fail --location --retry 3 --silent --show-error \
            "$SOURCE_BASE/data/news.json" \
            --output data/laboratory-news.json
          curl --fail --location --retry 3 --silent --show-error \
            "$SOURCE_BASE/data/email_status.json" \
            --output data/laboratory-email-status.json
          curl --fail --location --retry 3 --silent --show-error \
            https://laboratory-news-ai.atanu-barik.workers.dev \
            --output data/laboratory-ai-health.json

          for file in manifest.json latest.md quest-diagnostics.md labcorp.md arup-laboratories.md mayo-clinic-laboratories.md sonic-healthcare.md; do
            curl --fail --location --retry 3 --silent --show-error \
              "$SOURCE_BASE/knowledge/$file" \
              --output "data/laboratory-knowledge/$file"
          done

          for icon in product-services clinical-rd partnership-ma financials organizational leadership other; do
            curl --fail --location --retry 3 --silent --show-error \
              "$SOURCE_BASE/assets/email-icons/rendered/${icon}.png" \
              --output "assets/quest-news-icons/${icon}.png"
          done

          SOURCE_SHA=$(curl --fail --location --retry 3 --silent --show-error \
            https://api.github.com/repos/AtanuBarik/laboratory-news-monitor/commits/main \
            | python -c "import json,sys; print(json.load(sys.stdin)['sha'])")

          python - "$SOURCE_SHA" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          source_sha = sys.argv[1]
          news = json.loads(Path('data/laboratory-news.json').read_text(encoding='utf-8'))
          email = json.loads(Path('data/laboratory-email-status.json').read_text(encoding='utf-8'))
          worker = json.loads(Path('data/laboratory-ai-health.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('data/laboratory-knowledge/manifest.json').read_text(encoding='utf-8'))

          required = {
              'email_article_summary',
              'model_and_tool_fallbacks',
              'direct_publisher_page_read',
              'interactions_api',
          }
          capabilities = set(worker.get('capabilities') or [])
          missing = sorted(required - capabilities)
          if missing:
              raise SystemExit(f'AI Worker is missing required capabilities: {missing}')

          version = {
              'source_repository': 'AtanuBarik/laboratory-news-monitor',
              'source_commit': source_sha,
              'synchronized_at': datetime.now(timezone.utc).isoformat(),
              'news_generated_at': news.get('generated_at'),
              'news_item_count': news.get('item_count', len(news.get('items') or [])),
              'raw_relevant_item_count': news.get('raw_relevant_item_count'),
              'duplicates_merged': news.get('duplicates_merged'),
              'low_value_items_removed': news.get('low_value_items_removed'),
              'filter_policy': news.get('filter_policy'),
              'email_status': email.get('status'),
              'email_item_count': email.get('email_item_count', 0),
              'verified_summary_count': email.get('verified_summary_count', 0),
              'summary_pipeline': email.get('summary_pipeline') or worker.get('summary_pipeline'),
              'worker_capabilities': sorted(capabilities),
              'knowledge_generated_at': manifest.get('generated_at'),
          }
          Path('data/laboratory-source-version.json').write_text(
              json.dumps(version, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(version, indent=2))
          PY

      - name: Commit synchronized data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'quest-intelligence-sync[bot]'
          git config user.email 'quest-intelligence-sync[bot]@users.noreply.github.com'
          git add \
            data/laboratory-news.json \
            data/laboratory-email-status.json \
            data/laboratory-ai-health.json \
            data/laboratory-source-version.json \
            data/laboratory-knowledge \
            assets/quest-news-icons
          if git diff --cached --quiet; then
            echo 'Laboratory news data is already current.'
            exit 0
          fi
          git commit -m 'Sync latest laboratory news data, knowledge and capabilities'
          git pull --rebase origin main
          git push origin HEAD:main
