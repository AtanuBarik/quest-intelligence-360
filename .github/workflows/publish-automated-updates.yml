name: Publish Quest Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - chunks/**
      - integrations/**
      - data/**
      - assets/**
      - index.html
      - .pages-trigger
      - .github/workflows/publish-automated-updates.yml
  workflow_run:
    workflows:
      - Sync laboratory news data
      - Refresh live operations status
      - Refresh competitor profiles daily
    types: [completed]

permissions:
  contents: write

concurrency:
  group: quest-branch-pages
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Build optimized static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          node --check integrations/optimized-loader.js
          node --check integrations/frontend-content-cleanup.js
          node --check integrations/frontend-readability-overrides.js
          node --check integrations/frontend-stability-guard.js
          node --check integrations/executive-status-seed.js
          node --check integrations/executive-hub-final.js
          node --check integrations/executive-insight-split-layout.js
          node --check integrations/executive-typography-benchmark-cleanup.js
          node --check integrations/insights-engine-layout-v3.js
          node --check integrations/insights-engine-evidence-placement-final.js
          node --check integrations/alerts-signals-final.js
          node --check integrations/competitor-intelligence-profiles/loader.js
          node --check integrations/competitor-profiles-final.js
          python -m py_compile scripts/summarize_laboratory_news_openai.py

          python - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          release = '20260810d'
          chunks = [Path(f'chunks/chunk-{i:02d}.txt') for i in range(7)]
          missing = [str(path) for path in chunks if not path.exists()]
          if missing:
              raise SystemExit(f'Missing frontend chunks: {missing}')

          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
          html = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          html = html.replace('id="username" type="email" value="quest@medtech.com"', 'id="username" type="email" value=""')
          html = html.replace('id="password" type="password" value="evalueserve"', 'id="password" type="password" value=""')

          html = re.sub(
              r'\s*<button class="nav-item" data-view="landscape">.*?</button>\s*',
              '\n', html, count=1, flags=re.IGNORECASE | re.DOTALL,
          )
          html = re.sub(
              r'\s*<!--\s*LANDSCAPE\s*-->\s*<section class="view" data-view="landscape">.*?</section>\s*',
              '\n', html, count=1, flags=re.IGNORECASE | re.DOTALL,
          )
          html = re.sub(
              r",\s*landscape\s*:\s*['\"]Competitive Landscape['\"]",
              '', html, count=1, flags=re.IGNORECASE,
          )
          html = re.sub(r"\s*chart\('positioningBubble'.*?\);\s*", '\n', html, count=1, flags=re.DOTALL)
          html = re.sub(r"\s*chart\('capabilityRadar'.*?\);\s*", '\n', html, count=1, flags=re.DOTALL)
          if re.search(r'>\s*Competitive Landscape\s*<|data-view=["\']landscape["\']', html, flags=re.IGNORECASE):
              raise SystemExit('Competitive Landscape survived the Pages build scrub.')

          html = re.sub(
              r'<script\b[^>]*\bsrc=["\']https://cdn\.jsdelivr\.net/npm/chart\.js[^"\']*["\'][^>]*>\s*</script>',
              f'<script src="integrations/chart-lite.js?v={release}"></script>',
              html,
              flags=re.IGNORECASE,
          )
          html = re.sub(
              r'<script\b[^>]*\bsrc=["\'](?:\./)?integrations/[^"\']+["\'][^>]*>\s*</script>',
              lambda match: match.group(0) if 'chart-lite.js' in match.group(0) else '',
              html,
              flags=re.IGNORECASE,
          )
          loader = f'<script src="integrations/optimized-loader.js?v={release}"></script>'
          if '</body>' not in html:
              raise SystemExit('The decompressed application shell has no closing body tag.')
          html = html.replace('</body>', loader + '</body>', 1)
          Path('_site/index.html').write_text(html, encoding='utf-8')
          print(f'Built optimized application shell: {len(html):,} characters')
          PY

          cp -R integrations _site/
          cp -R data _site/
          if [ -d assets ]; then cp -R assets _site/; fi
          touch _site/.nojekyll
          test -f _site/integrations/role-access-governance.js
          test -f _site/integrations/chart-lite.js
          test -f _site/integrations/optimized-loader.js
          test -f _site/integrations/frontend-content-cleanup.js
          test -f _site/integrations/frontend-readability-overrides.js
          test -f _site/integrations/frontend-stability-guard.js
          test -f _site/integrations/executive-status-seed.js
          test -f _site/integrations/executive-hub-final.js
          test -f _site/integrations/executive-insight-split-layout.js
          test -f _site/integrations/executive-typography-benchmark-cleanup.js
          test -f _site/integrations/insights-engine-layout-v3.js
          test -f _site/integrations/insights-engine-evidence-placement-final.js
          test -f _site/integrations/alerts-signals-final.js
          test -f _site/integrations/competitor-intelligence-profiles/loader.js
          test -f _site/integrations/competitor-profiles-final.js
          test -f _site/integrations/knowledge-repository-lite.js
          test -f _site/integrations/knowledge-legacy-guard.js
          test -f _site/integrations/competitor-daily-refresh.js
          test -f _site/integrations/strategic-analysis-hub.js
          test -f _site/integrations/strategic-source-watch-status.js
          test -f _site/integrations/laboratory-news-sync.js
          test -f _site/integrations/alerts-resilience-fix.js
          test -f _site/data/competitor-source-registry.json
          test -f _site/data/strategic-analysis.json
          test -f _site/data/executive-public-intelligence.json
          test -f _site/data/laboratory-article-summaries-01.b64
          test -f _site/data/laboratory-article-summaries-02.b64
          test -f _site/data/laboratory-article-summaries-03.b64
          if [ -f _site/data/laboratory-workflow-health.json ]; then
            test -f _site/data/laboratory-chatgpt-strategic-synthesis.json
            test -f _site/data/laboratory-chatgpt-summaries.json
          fi
          du -sh _site

      - name: Publish files to gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'quest-pages[bot]'
          git config user.email 'quest-pages[bot]@users.noreply.github.com'

          git fetch origin gh-pages:gh-pages
          rm -rf /tmp/quest-pages
          git worktree add /tmp/quest-pages gh-pages

          find /tmp/quest-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/_site/." /tmp/quest-pages/

          cd /tmp/quest-pages
          git add -A
          if git diff --cached --quiet; then
            git commit --allow-empty -m "Redeploy Quest dashboard from ${GITHUB_SHA::7}"
          else
            git commit -m "Publish Quest dashboard from ${GITHUB_SHA::7}"
          fi
          git push origin gh-pages

          echo 'Published gh-pages. The repository Pages configuration will create the single deployment automatically.'
