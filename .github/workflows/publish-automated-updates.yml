name: Publish Quest Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - chunks/**
      - integrations/**
      - data/**
      - assets/**
      - index.html
      - .pages-trigger
  workflow_run:
    workflows:
      - Sync laboratory news data
      - Refresh live operations status
      - Refresh competitor profiles daily
    types: [completed]

permissions:
  contents: write
  pages: write

concurrency:
  group: quest-branch-pages
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Clear stale Pages deployment locks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for deployment in \
            ebdb0d756391b16ca690deb787285b52b694e2ce \
            1f8bbc61d4ae44b4c5f89b6329435dc097bd4f77
          do
            code=$(curl --silent --output /tmp/cancel-response.txt --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments/$deployment/cancel" || true)
            echo "Cancel request for $deployment returned HTTP $code"
            if [ -s /tmp/cancel-response.txt ]; then cat /tmp/cancel-response.txt; fi
          done
          sleep 8

      - name: Build optimized static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          python - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          release = '20260807c'
          chunks = [Path(f'chunks/chunk-{i:02d}.txt') for i in range(7)]
          missing = [str(path) for path in chunks if not path.exists()]
          if missing:
              raise SystemExit(f'Missing frontend chunks: {missing}')

          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
          html = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          html = re.sub(
              r'<script\b[^>]*\bsrc=["\']https://cdn\.jsdelivr\.net/npm/chart\.js[^"\']*["\'][^>]*>\s*</script>',
              f'<script src="integrations/chart-lite.js?v={release}"></script>',
              html,
              flags=re.IGNORECASE,
          )
          html = re.sub(
              r'<script\b[^>]*\bsrc=["\'](?:\./)?integrations/[^"\']+["\'][^>]*>\s*</script>',
              lambda match: match.group(0) if 'chart-lite.js' in match.group(0) else '',
              html,
              flags=re.IGNORECASE,
          )
          loader = f'<script src="integrations/optimized-loader.js?v={release}"></script>'
          if '</body>' not in html:
              raise SystemExit('The decompressed application shell has no closing body tag.')
          html = html.replace('</body>', loader + '</body>', 1)
          Path('_site/index.html').write_text(html, encoding='utf-8')
          print(f'Built optimized application shell: {len(html):,} characters')
          PY

          cp -R integrations _site/
          cp -R data _site/
          if [ -d assets ]; then cp -R assets _site/; fi
          touch _site/.nojekyll
          test -f _site/integrations/chart-lite.js
          test -f _site/integrations/competitor-daily-refresh.js
          test -f _site/integrations/strategic-analysis-hub.js
          test -f _site/integrations/laboratory-news-sync.js
          test -f _site/data/competitor-source-registry.json
          test -f _site/data/strategic-analysis.json
          if [ -f _site/data/laboratory-workflow-health.json ]; then
            test -f _site/data/laboratory-chatgpt-strategic-synthesis.json
            test -f _site/data/laboratory-chatgpt-summaries.json
          fi
          du -sh _site

      - name: Publish files to gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'quest-pages[bot]'
          git config user.email 'quest-pages[bot]@users.noreply.github.com'

          git fetch origin gh-pages:gh-pages
          rm -rf /tmp/quest-pages
          git worktree add /tmp/quest-pages gh-pages

          find /tmp/quest-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/_site/." /tmp/quest-pages/

          cd /tmp/quest-pages
          git add -A
          if git diff --cached --quiet; then
            git commit --allow-empty -m "Redeploy Quest dashboard from ${GITHUB_SHA::7}"
          else
            git commit -m "Publish Quest dashboard from ${GITHUB_SHA::7}"
          fi
          git push origin gh-pages

      - name: Start one branch-based Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
          echo
          echo 'Requested one Pages build from the updated gh-pages branch.'
