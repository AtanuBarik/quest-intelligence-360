name: Validate Quest frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'integrations/**/*.js'
      - 'data/**/*.json'
      - 'scripts/build_pages_materialized.py'
      - '.github/workflows/validate-frontend.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'integrations/**/*.js'
      - 'data/**/*.json'
      - 'scripts/build_pages_materialized.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find integrations -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate JSON data files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('data').glob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'Validated {path}')
          PY

      - name: Confirm stable application entry point
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'integrations/optimized-loader.js' index.html
          grep -q 'quest-brand-system.js' integrations/optimized-loader.js
          grep -q 'frontend-performance-layout.js' integrations/optimized-loader.js
          grep -q 'local-data-fetch-bridge.js' integrations/optimized-loader.js
          grep -q 'no-cost-live-operations.js' integrations/optimized-loader.js
          grep -q 'platform-runtime-stability.js' integrations/frontend-critical-nav-survey.js
          grep -q 'competitive-intelligence-live-refresh/loader.js' integrations/frontend-critical-nav-survey.js
          grep -q 'alerts-chatgpt-summaries.js' integrations/frontend-critical-nav-survey.js
          test -s integrations/competitive-intelligence-live-refresh/loader.js
          test -s integrations/alerts-chatgpt-summaries.js
          if grep -Eq 'laboratory-news-monitor\.js|competitor-daily-refresh\.js|strategic-news-social-hubs\.js' integrations/optimized-loader.js; then
            echo 'Legacy competitive modules must not be lazy-loaded by optimized-loader.js.' >&2
            exit 1
          fi
          echo 'Stable navigation, filters, Alerts summaries, and competitive intelligence loaders are configured.'
