name: Validate Quest frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'integrations/**/*.js'
      - 'data/**/*.json'
      - '.github/workflows/validate-frontend.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'integrations/**/*.js'
      - 'data/**/*.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find integrations -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Validate JSON data files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('data').glob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'Validated {path}')
          PY
      - name: Confirm application entry point
        shell: bash
        run: |
          grep -q 'no-cost-live-operations.js' index.html
          grep -q 'local-data-fetch-bridge.js' index.html
          grep -q 'quest-brand-system.js' index.html
