name: Validate Persona Intelligence
on:
  pull_request:
    paths:
      - index.html
      - integrations/**
      - data/persona-intelligence.json
      - scripts/build_pages_materialized.py
      - tests/**
      - .github/workflows/validate-persona-intelligence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persona-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Check source contracts and materialize the site
        run: |
          node --check integrations/team-workspaces.js
          node --check integrations/persona-intelligence.js
          node tests/test_persona_contract.mjs
          python scripts/build_pages_materialized.py
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test all teams and access levels
        run: |
          python -m http.server 8765 --directory _site > /tmp/quest-http.log 2>&1 &
          python tests/test_persona_browser.py --url http://127.0.0.1:8765 --output test-results/personas
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-regression-evidence
          path: test-results/personas
          retention-days: 7
