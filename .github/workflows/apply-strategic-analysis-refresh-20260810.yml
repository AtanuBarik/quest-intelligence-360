name: Apply strategic analysis refresh 2026-08-10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-strategic-analysis-refresh-20260810.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply researched strategic-intelligence changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/strategic-analysis.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          data['metadata']['last_updated'] = '2026-08-10T08:13:00+05:30'
          data['metadata']['research_window'] = 'Public information reviewed through 10 Aug 2026'

          companies = {company['id']: company for company in data['companies']}

          quest = companies['quest']
          quest['current_focus'] = 'Physician, hospital and consumer channel growth; Corewell Health and Fresenius collaborations; advanced diagnostics; oncology/MRD; and automation that simplifies specimen collection and clinical workflows.'
          quest['operational_strategy'] = 'Use a national laboratory and logistics network, joint ventures and health-system partnerships to improve density, access and operating leverage, while extending laboratory automation and digital specimen-quality tools across the network.'
          quest['commercial_strategy'] = 'Leverage national payer access, physician reach, hospital relationships, joint ventures and consumer/wearable partnerships to expand testing occasions and cross-sell advanced diagnostics.'
          quest['momentum'] = 90
          quest['timeline'] = [
              {'date':'2025-03','event':'Investor Day set a long-term 4-5% revenue CAGR and 7-9% adjusted EPS CAGR ambition, with advanced diagnostics and partnerships as growth engines.'},
              {'date':'2026-03','event':'Introduced an AI Companion for patients, signaling a stronger consumer interpretation and digital-engagement strategy.'},
              {'date':'2026-07','event':'Q2 revenue grew 10.2% with 10.0% organic growth; Quest raised 2026 guidance while highlighting Corewell/Fresenius partnerships, consumer/wearable growth, Advanced Diagnostics, Haystack MRD, OncoEMR integration and broader automation.'}
          ]
          quest['sources'] = [
              {'label':'2025 Investor Day','type':'Investor presentation','url':'https://ir.questdiagnostics.com/press-releases/press-release-details/2025/Quest-Diagnostics-to-Highlight-Strategic-Priorities-to-Drive-Sustainable-Growth-and-Deliver-Long-term-Shareholder-Value-at-2025-Investor-Day/default.aspx'},
              {'label':'2025 Annual Report / 10-K','type':'SEC / annual report','url':'https://ir.questdiagnostics.com/financial-info/annual-reports/default.aspx'},
              {'label':'Q2 2026 results','type':'Official earnings release','url':'https://newsroom.questdiagnostics.com/2026-07-23-Quest-Diagnostics-Reports-Second-Quarter-2026-Financial-Results-Raises-Revenue-and-EPS-Guidance-for-Full-Year-2026'},
              {'label':'OncoEMR integration','type':'Official announcement','url':'https://ir.questdiagnostics.com/press-releases/press-release-details/2026/Quest-Diagnostics-Now-the-Largest-Clinical-Reference-Lab-to-Extend-Oncology-Test-Access-Through-OncoEMR-MPI/default.aspx'}
          ]

          eurofins = companies['eurofins']
          eurofins['current_focus'] = 'Margin expansion, laboratory-network digitization, hub-and-spoke productivity, selective acquisitions and cash-flow/ROCE improvement, including expansion of North American life-sciences testing.'
          eurofins['business_strategy'] = 'Compound organic growth with disciplined M&A across testing verticals while converting past infrastructure investments into stronger margins and cash returns; the planned Element North American Life Sciences Testing Services acquisition reinforces geographic and capability expansion.'
          eurofins['commercial_strategy'] = 'Leverage local specialist businesses and broad global testing capabilities to cross-sell and support complex client needs, while filling geographic gaps in the U.S. and Canada through targeted acquisitions.'
          eurofins['momentum'] = 80
          eurofins['timeline'] = [
              {'date':'2026-07','event':'H1 2026 reporting showed progress toward 2027 objectives, including 130 bps of adjusted EBITDA margin expansion and 29% EPS growth.'},
              {'date':'2026-07','event':'Agreed to acquire Element Materials Technology’s North American Life Sciences Testing Services business for a $400M enterprise value, adding 27 laboratories/facilities and more than $150M of expected 2026 revenue.'},
              {'date':'2028 horizon','event':'Targets a fully invested and highly digital hub-and-spoke laboratory platform supporting productivity, service and cash-flow growth.'}
          ]
          eurofins['sources'] = [
              {'label':'Investor strategy and H1 2026 results','type':'Investor relations','url':'https://www.eurofins.com/en/investors/'},
              {'label':'Element North America life-sciences transaction','type':'Official acquisition announcement','url':'https://www.eurofins.com/en/media-centre/press-releases/eurofins-agrees-to-acquire-element-materials-technology-s-life-sciences-testing-services-business-in-north-america/'},
              {'label':'2026 reports and presentations','type':'Financial reporting','url':'https://www.eurofins.com/investors/reports-and-presentations/'}
          ]

          natera = companies['natera']
          natera['current_focus'] = 'Scale testing volume, expand Signatera and Fetal Focus, build evidence and reimbursement, internationalize MRD, broaden Prospera coverage, increase sequencing capacity and invest aggressively in R&D.'
          natera['future_focus'] = 'Make personalized genetic testing and longitudinal molecular monitoring standard of care across oncology, reproductive health and transplantation, with Signatera expanding through U.S., European and Japanese regulatory pathways.'
          natera['commercial_strategy'] = 'Drive guideline, payer and physician adoption using specialty sales forces, clinical evidence, regulatory approvals, coverage expansion and increasing health-system integration.'
          natera['momentum'] = 97
          natera['timeline'] = [
              {'date':'2026-05','event':'Q1 revenue grew 38.8% and oncology test volume grew 54.4%; 2026 revenue guidance increased to $2.74B-$2.82B.'},
              {'date':'2026-05','event':'Announced a major Austin sequencing expansion described as creating what is believed to be the world’s largest sequencing facility.'},
              {'date':'2026-06/07','event':'Signatera added FDA companion-diagnostic approval, Japan colorectal-cancer approval and EU IVDR certification across multiple cancers; MolDx also finalized expanded surveillance coverage for Prospera across kidney, heart and lung transplantation.'}
          ]
          natera['sources'] = [
              {'label':'Q1 2026 results','type':'Earnings / investor release','url':'https://investor.natera.com/news/news-details/2026/Natera-Reports-First-Quarter-2026-Financial-Results/default.aspx'},
              {'label':'Signatera IVDR certification','type':'Official regulatory announcement','url':'https://investor.natera.com/news/news-details/2026/Natera-Announces-IVDR-Certification-for-Signatera-Across-Multiple-Cancers/default.aspx'},
              {'label':'Expanded Prospera MolDx coverage','type':'Official coverage announcement','url':'https://investor.natera.com/news/news-details/2026/Finalized-MolDx-LCD-Includes-Expanded-Coverage-for-Nateras-Prospera-Portfolio/default.aspx'},
              {'label':'2026 company news','type':'Official announcements','url':'https://investor.natera.com/news/'}
          ]

          guardant = companies['guardant']
          guardant['current_focus'] = 'Accelerate oncology volume, scale Shield colorectal screening, convert guideline and payer wins into adoption, expand enterprise health-system integration, deepen companion diagnostics/MRD and build biopharma data services.'
          guardant['future_focus'] = 'Build a multi-product blood-based oncology platform spanning screening, treatment selection, therapy response and recurrence monitoring, while scaling a higher-throughput Shield workflow and improving unit economics.'
          guardant['operational_strategy'] = 'Scale sequencing and commercial infrastructure while investing in laboratory capacity for rapid Shield growth; FDA approval of a higher-throughput, lower-COGS Shield workflow supports the path to improved screening economics.'
          guardant['commercial_strategy'] = 'Use oncology sales, payer coverage, health-system teams and enterprise integrations to move from specialist testing into system-wide screening and monitoring workflows; American Cancer Society guideline inclusion and UnitedHealth coverage materially strengthen Shield commercialization.'
          guardant['threat_to_quest'] = 'Very high in liquid biopsy and blood-based screening: rapid oncology volume growth plus guideline, payer and workflow validation for Shield can shift high-value cancer screening and monitoring toward a focused molecular platform.'
          guardant['quest_response'] = 'Use Quest access and oncology workflows to bundle MRD, CGP and complementary testing; protect the screening access layer through payer, physician, collection and digital integration advantages.'
          guardant['scores'] = [3,3,5,5,5,4,5]
          guardant['momentum'] = 97
          guardant['timeline'] = [
              {'date':'2025','event':'Shield screening scaled rapidly; Guardant expanded oncology, screening and biopharma/data revenue while improving gross margin.'},
              {'date':'2026-07','event':'Q2 revenue grew 44%; oncology test volume grew 63% to about 104,000 tests and Shield volume reached about 66,000 tests; 2026 revenue guidance increased to $1.34B-$1.36B.'},
              {'date':'2026-07','event':'Shield entered updated American Cancer Society colorectal-screening guidelines, gained UnitedHealth coverage and received FDA approval for a higher-throughput, lower-COGS workflow; Guardant360 Liquid CDx also received FDA approval.'}
          ]
          guardant['sources'] = [
              {'label':'Q2 2026 results','type':'Earnings / investor release','url':'https://investors.guardanthealth.com/press-releases/press-releases/2026/Guardant-Health-Reports-Second-Quarter-2026-Financial-Results-and-Increases-2026-Revenue-Guidance/default.aspx'},
              {'label':'2025 Annual Report','type':'Annual report','url':'https://investors.guardanthealth.com/financials/annual-reports/default.aspx'},
              {'label':'2026 presentations','type':'Investor presentations','url':'https://investors.guardanthealth.com/events-and-presentations/default.aspx'}
          ]

          tempus = companies['tempus']
          tempus['current_focus'] = 'Grow oncology diagnostics, hereditary testing, data licensing and AI applications; scale MRD; commercialize foundation models; deepen health-system connectivity; and prepare integration of Personalis.'
          tempus['future_focus'] = 'Create an integrated longitudinal precision-oncology platform from diagnosis through treatment, monitoring and recurrence, powered by multimodal data, AI and foundation models; the proposed Personalis acquisition strengthens tumor-informed MRD.'
          tempus['operational_strategy'] = 'Scale regulated laboratories and data infrastructure together while improving operating leverage; Q2 2026 produced positive adjusted EBITDA and Tempus added capital through a $460M zero-coupon convertible offering.'
          tempus['commercial_strategy'] = 'Sell to oncologists, health systems and biopharma simultaneously; use connected provider networks, large data/application bookings, foundation-model collaborations and enterprise deployments such as USC to deepen ecosystem lock-in.'
          tempus['technology_strategy'] = 'Combine large multimodal datasets, AI/foundation models, agentic software, digital pathology and diagnostics; FDA-approved xT Tumor Only and the proposed Personalis acquisition expand regulated CGP and tumor-informed MRD capabilities.'
          tempus['momentum'] = 99
          tempus['timeline'] = [
              {'date':'2026-05','event':'Investor Day and next-generation Lens launch reinforced an agentic-AI plus multimodal-data strategy.'},
              {'date':'2026-07','event':'Q2 revenue grew 22% to $382.5M; oncology volume grew 31%; MRD volume reached 9,000 tests; Insights revenue grew 36%; and Tempus delivered its first oncology foundation model to AstraZeneca.'},
              {'date':'2026-07','event':'Announced the proposed ~$1.5B enterprise-value acquisition of Personalis, while expanding health-system AI/diagnostic integration through USC and other enterprise partnerships.'}
          ]
          tempus['sources'] = [
              {'label':'Q2 2026 results','type':'Earnings / investor release','url':'https://investors.tempus.com/news-releases/news-release-details/tempus-reports-second-quarter-2026-results'},
              {'label':'2026 Investor Day','type':'Investor presentation','url':'https://investors.tempus.com/events/event-details/tempus-ai-investor-day'},
              {'label':'Personalis acquisition announcement','type':'Strategic transaction / SEC-supported','url':'https://investors.tempus.com/news-releases/news-release-details/tempus-acquire-personalis-more-tightly-integrating-molecular'}
          ]

          warnings = data['warnings']
          for warning in warnings:
              if warning['title'] == 'MRD is becoming a strategic battleground':
                  warning['detail'] = 'Quest Haystack, Natera Signatera, Guardant and Tempus/Personalis are converging on longitudinal molecular monitoring. Natera is internationalizing Signatera while Tempus MRD volume reached 9,000 tests in Q2; evidence, reimbursement, regulatory reach and workflow integration will determine share.'
          blood_warning = {
              'severity':'High',
              'title':'Blood-based colorectal screening is crossing adoption thresholds',
              'detail':'Guardant Shield reached about 66,000 Q2 tests, entered updated American Cancer Society screening guidelines, gained UnitedHealth coverage and added a higher-throughput FDA-approved workflow. Screening competition is moving beyond clinical validation into scaled reimbursement and delivery.'
          }
          if not any(w['title'] == blood_warning['title'] for w in warnings):
              warnings.append(blood_warning)

          opportunity = {
              'title':'Defend the screening access layer',
              'detail':'Use Quest payer reach, patient-service access, physician relationships and digital ordering/results to remain the preferred collection and integration layer as blood-based cancer-screening options scale.'
          }
          if not any(o['title'] == opportunity['title'] for o in data['opportunities']):
              data['opportunities'].append(opportunity)

          for pattern in data['market_patterns']:
              if pattern['theme'] == 'Consumer diagnostics':
                  pattern['intensity'] = 89
                  pattern['leaders'] = 'Guardant, Abbott/Exact, Labcorp, Natera, Quest'
              if pattern['theme'] == 'Strategic collaborations':
                  pattern['intensity'] = 90

          new_watch = [
              'https://newsroom.questdiagnostics.com/2026-07-23-Quest-Diagnostics-Reports-Second-Quarter-2026-Financial-Results-Raises-Revenue-and-EPS-Guidance-for-Full-Year-2026',
              'https://www.eurofins.com/en/media-centre/press-releases/eurofins-agrees-to-acquire-element-materials-technology-s-life-sciences-testing-services-business-in-north-america/',
              'https://investor.natera.com/news/news-details/2026/Natera-Announces-IVDR-Certification-for-Signatera-Across-Multiple-Cancers/default.aspx',
              'https://investors.guardanthealth.com/press-releases/press-releases/2026/Guardant-Health-Reports-Second-Quarter-2026-Financial-Results-and-Increases-2026-Revenue-Guidance/default.aspx',
              'https://investors.tempus.com/news-releases/news-release-details/tempus-reports-second-quarter-2026-results'
          ]
          for url in new_watch:
              if url not in data['source_watch']:
                  data['source_watch'].append(url)

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Commit strategic refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'strategic-analysis-refresh[bot]'
          git config user.email 'strategic-analysis-refresh[bot]@users.noreply.github.com'
          git add data/strategic-analysis.json
          if git diff --cached --quiet; then
            echo 'No strategic data changes were produced.'
            exit 0
          fi
          git commit -m 'Refresh strategic analysis with Q2 and regulatory signals'
          git pull --rebase origin main
          git push origin HEAD:main
