name: Summarize laboratory news with ChatGPT

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sync laboratory news data
    types: [completed]
  schedule:
    # Hourly safety pass; the workflow_run trigger still starts immediately after every successful source sync.
    - cron: '20 * * * *'
      timezone: 'Asia/Kolkata'
  push:
    branches: [main]
    paths:
      - 'scripts/summarize_laboratory_news_openai.py'
      - '.github/workflows/summarize-laboratory-news-chatgpt.yml'

permissions:
  contents: write

concurrency:
  group: summarize-laboratory-news-chatgpt
  cancel-in-progress: true

jobs:
  summarize:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_SUMMARY_MODEL: gpt-5-chat-latest
      OPENAI_SUMMARY_MAX_ITEMS: '75'
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm synchronized news exists
        shell: bash
        run: |
          set -euo pipefail
          test -s data/laboratory-news.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/laboratory-news.json').read_text(encoding='utf-8'))
          items=data.get('items') or []
          if not items:
              raise SystemExit('No laboratory news items available for summarization')
          print(f'Laboratory news items: {len(items)}')
          PY

      - name: Create immediate brief for every new article
        shell: bash
        env:
          OPENAI_SUMMARY_MODE: fallback
        run: |
          set -euo pipefail
          python scripts/summarize_laboratory_news_openai.py

      - name: Publish immediate summary coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'quest-alert-summaries[bot]'
          git config user.email 'quest-alert-summaries[bot]@users.noreply.github.com'
          git add data/laboratory-openai-summaries.json
          if git diff --cached --quiet; then
            echo 'Immediate article briefs are already current.'
          else
            git commit -m 'Add immediate summaries for new laboratory news'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enrich immediate briefs with content-aware ChatGPT summaries
        shell: bash
        env:
          OPENAI_SUMMARY_MODE: enrich
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo 'OPENAI_API_KEY is not configured; immediate feed-grounded briefs remain active for every article.'
            exit 0
          fi
          python scripts/summarize_laboratory_news_openai.py

      - name: Publish content-aware ChatGPT enrichment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'quest-chatgpt-summaries[bot]'
          git config user.email 'quest-chatgpt-summaries[bot]@users.noreply.github.com'
          git add data/laboratory-openai-summaries.json
          if git diff --cached --quiet; then
            echo 'Content-aware ChatGPT summaries are already current.'
            exit 0
          fi
          git commit -m 'Refresh content-aware ChatGPT laboratory summaries'
          git pull --rebase origin main
          git push origin HEAD:main