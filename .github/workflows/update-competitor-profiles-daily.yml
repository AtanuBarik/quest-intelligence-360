name: Refresh competitor profiles daily

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-competitor-profiles-daily.yml'
      - 'scripts/update_competitor_profiles.py'
      - 'scripts/clean_competitor_refresh.py'
      - 'data/competitor-source-registry.json'
      - '.competitor-refresh-trigger'

permissions:
  contents: write

concurrency:
  group: competitor-profile-daily-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Run public-web competitor refresh
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_competitor_profiles.py scripts/clean_competitor_refresh.py
          python scripts/update_competitor_profiles.py
          python scripts/clean_competitor_refresh.py

      - name: Validate generated competitor refresh data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('data/competitor-source-registry.json')
          refresh_path = Path('data/competitor-daily-refresh.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          payload = json.loads(refresh_path.read_text(encoding='utf-8'))

          expected = [item.get('id') for item in (registry.get('competitors') or []) if item.get('id')]
          competitors = payload.get('competitors') or []
          actual = [item.get('id') for item in competitors if item.get('id')]
          if not expected:
              raise SystemExit('Competitor source registry has no approved competitors')

          missing = sorted(set(expected) - set(actual))
          extras = sorted(set(actual) - set(expected))
          if missing:
              raise SystemExit(f'Missing approved competitor refresh records: {missing}')
          if extras:
              raise SystemExit(f'Unexpected competitor refresh records outside the approved registry: {extras}')
          if len(actual) != len(expected):
              raise SystemExit(f'Expected {len(expected)} approved competitor records, found {len(actual)}')

          invalid = []
          partial = []
          for item in competitors:
              if not item.get('id') or not item.get('last_updated_at') or not item.get('last_checked_at'):
                  invalid.append(item.get('id') or '<missing-id>')
              if item.get('refresh_status') in {'partial', 'error'}:
                  partial.append(item.get('id'))
          if invalid:
              raise SystemExit(f'Invalid refresh records: {invalid}')

          print('Validated approved competitor refresh records:', len(competitors))
          print('Changed competitors:', ', '.join(payload.get('changed_competitors') or []) or 'none')
          print('Partial/error competitors retained with source diagnostics:', ', '.join(partial) or 'none')
          PY

      - name: Commit refreshed public intelligence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'quest-competitor-refresh[bot]'
          git config user.email 'quest-competitor-refresh[bot]@users.noreply.github.com'
          git add data/competitor-daily-refresh.json data/competitor-refresh-log.json
          if git diff --cached --quiet; then
            echo 'No refresh-file changes to publish.'
            exit 0
          fi
          git commit -m 'Refresh competitor public intelligence'
          git pull --rebase origin main
          git push origin HEAD:main
