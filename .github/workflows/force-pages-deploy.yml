name: Force Quest Pages Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - index.html
      - chunks/**
      - integrations/**
      - data/**
      - assets/**
      - scripts/build_pages_materialized.py
      - .pages-trigger
      - .github/workflows/force-pages-deploy.yml
  workflow_run:
    workflows:
      - Sync laboratory news data
      - Refresh live operations status
      - Refresh competitor profiles daily
      - Watch strategic intelligence sources
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: quest-pages-branch-publish
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate frontend and build logic
        shell: bash
        run: |
          set -euo pipefail
          node --check integrations/frontend-critical-nav-survey.js
          node --check integrations/survey-analytics-dashboard-final.js
          node --check integrations/survey-analytics-failsafe.js
          node --check integrations/chart-alignment-system.js
          node --check integrations/frontend-quality-guard.js
          node --check integrations/platform-runtime-stability.js
          node --check integrations/optimized-loader.js
          node --check integrations/pmr-repository-dashboard-final.js
          node --check integrations/voice-experts-dashboard-final.js
          node --check integrations/quest-enterprise-insights-override.js
          node --check integrations/competitive-intelligence-live-refresh/loader.js
          node --check integrations/alerts-chatgpt-summaries.js
          python -m py_compile scripts/build_pages_materialized.py
          python -m json.tool data/survey-analytics-demo.json >/dev/null
          python -m json.tool data/pmr-insight-library.json >/dev/null
          python -m json.tool data/voice-experts-analysis.json >/dev/null
          python -m json.tool data/competitor-source-registry.json >/dev/null
          test -s data/quest-insights-q1.gz.b64
          test -s data/quest-insights-q2.gz.b64
          test -s data/alerts-chatgpt-summaries.gz.b64

      - name: Build materialized frontend
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_pages_materialized.py
          test -f _site/index.html
          test -f _site/integrations/frontend-critical-nav-survey.js
          test -f _site/integrations/survey-analytics-dashboard-final.js
          test -f _site/integrations/survey-analytics-failsafe.js
          test -f _site/integrations/chart-alignment-system.js
          test -f _site/integrations/frontend-quality-guard.js
          test -f _site/integrations/platform-runtime-stability.js
          test -f _site/integrations/optimized-loader.js
          test -f _site/integrations/quest-enterprise-insights-override.js
          test -f _site/integrations/competitive-intelligence-live-refresh/loader.js
          test -f _site/integrations/alerts-chatgpt-summaries.js
          test -f _site/data/survey-analytics-demo.json
          test -s _site/data/quest-insights-q1.gz.b64
          test -s _site/data/quest-insights-q2.gz.b64
          test -s _site/data/alerts-chatgpt-summaries.gz.b64
          grep -q 'Loading multi-project Survey Analytics' _site/index.html
          grep -q 'survey-analytics-failsafe.js?v=20260901stable2' _site/index.html
          grep -q 'chart-alignment-system.js?v=20260901stable2' _site/index.html
          grep -q 'frontend-quality-guard.js?v=20260901stable2' _site/index.html
          grep -q 'platform-runtime-stability.js?v=20260901stable2' _site/index.html
          grep -q 'quest-enterprise-insights-override.js?v=20260901stable2' _site/index.html
          grep -q 'competitive-intelligence-live-refresh/loader.js?v=20260901stable2' _site/index.html
          grep -q 'alerts-chatgpt-summaries.js?v=20260901stable2' _site/index.html
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('_site/index.html').read_text(encoding='utf-8')
          if 'data-view="survey"' not in html:
              raise SystemExit('Canonical Survey Analytics route missing from materialized frontend.')
          if 'data-view="surveys"' in html:
              raise SystemExit('Legacy Survey Analytics route alias survived build.')
          forbidden = [
              r'Competitive Landscape',
              r'data-view=["\']landscape["\']',
              r'data-view-jump=["\']landscape["\']',
              r'positioningBubble',
              r'capabilityRadar',
          ]
          for pattern in forbidden:
              if re.search(pattern, html, flags=re.I):
                  raise SystemExit(f'Competitive Landscape residue survived build: {pattern}')
          print('Materialized navigation and stable release checks passed.')
          PY

      - name: Publish materialized site to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'quest-pages[bot]'
          git config user.email 'quest-pages[bot]@users.noreply.github.com'
          git fetch origin gh-pages:gh-pages
          rm -rf /tmp/quest-pages
          git worktree add /tmp/quest-pages gh-pages
          find /tmp/quest-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/_site/." /tmp/quest-pages/
          cd /tmp/quest-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized site changes to publish."
            exit 0
          fi
          git commit -m "Publish Quest Pages release 20260901stable2"
          git push origin gh-pages
          echo "gh-pages synchronized. GitHub Pages native deployment is the sole deployment path."
