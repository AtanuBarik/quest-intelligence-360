name: Force Quest Pages Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - index.html
      - chunks/**
      - integrations/**
      - data/**
      - assets/**
      - scripts/build_pages_materialized.py
      - .pages-trigger
      - .github/workflows/force-pages-deploy.yml
  workflow_run:
    workflows:
      - Sync laboratory news data
      - Refresh live operations status
      - Refresh competitor profiles daily
      - Watch strategic intelligence sources
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: quest-pages-authoritative-deploy
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate frontend and build logic
        shell: bash
        run: |
          set -euo pipefail
          node --check integrations/frontend-critical-nav-survey.js
          node --check integrations/survey-analytics-dashboard-final.js
          node --check integrations/survey-analytics-failsafe.js
          node --check integrations/chart-alignment-system.js
          node --check integrations/frontend-quality-guard.js
          node --check integrations/optimized-loader.js
          node --check integrations/pmr-repository-dashboard-final.js
          node --check integrations/voice-experts-dashboard-final.js
          python -m py_compile scripts/build_pages_materialized.py
          python -m json.tool data/survey-analytics-demo.json >/dev/null
          python -m json.tool data/pmr-insight-library.json >/dev/null
          python -m json.tool data/voice-experts-analysis.json >/dev/null
          python -m json.tool data/competitor-source-registry.json >/dev/null

      - name: Build materialized frontend
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_pages_materialized.py
          test -f _site/index.html
          test -f _site/integrations/frontend-critical-nav-survey.js
          test -f _site/integrations/survey-analytics-dashboard-final.js
          test -f _site/integrations/survey-analytics-failsafe.js
          test -f _site/integrations/chart-alignment-system.js
          test -f _site/integrations/frontend-quality-guard.js
          test -f _site/integrations/optimized-loader.js
          test -f _site/data/survey-analytics-demo.json
          grep -q 'Loading multi-project Survey Analytics' _site/index.html
          grep -q 'survey-analytics-failsafe.js?v=20260811b' _site/index.html
          grep -q 'chart-alignment-system.js?v=20260811b' _site/index.html
          grep -q 'frontend-quality-guard.js?v=20260811b' _site/index.html
          grep -q 'data-view="survey"' _site/index.html
          if grep -q 'data-view="surveys"' _site/index.html; then
            echo 'Legacy Survey Analytics route alias survived build.' >&2
            exit 1
          fi
          if grep -Eiq 'Competitive Landscape|data-view=["'"']landscape["'"']|data-view-jump=["'"']landscape["'"']|positioningBubble|capabilityRadar' _site/index.html; then
            echo 'Competitive Landscape residue survived build.' >&2
            exit 1
          fi

      - name: Keep gh-pages synchronized
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'quest-pages[bot]'
          git config user.email 'quest-pages[bot]@users.noreply.github.com'
          git fetch origin gh-pages:gh-pages
          rm -rf /tmp/quest-pages
          git worktree add /tmp/quest-pages gh-pages
          find /tmp/quest-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/_site/." /tmp/quest-pages/
          cd /tmp/quest-pages
          git add -A
          if git diff --cached --quiet; then
            git commit --allow-empty -m "Redeploy Quest Pages release 20260811b"
          else
            git commit -m "Publish Quest Pages release 20260811b"
          fi
          git push origin gh-pages

      - name: Request legacy Pages build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact directly to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Report deployment mode
        shell: bash
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "Direct GitHub Pages artifact deployment succeeded."
          else
            echo "Legacy Pages branch build was requested and remains authoritative."
          fi
