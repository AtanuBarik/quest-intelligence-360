<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#034c1f"><title>Quest Intelligence 360</title><style>body{margin:0;background:#f2f6f0;color:#034c1f;font:15px/1.6 Arial,sans-serif}.boot{max-width:620px;margin:12vh auto;padding:32px;background:white;border:1px solid #dce5d8;border-radius:20px}.boot strong{display:block;font-size:24px}.boot progress{width:100%;accent-color:#35792a}.boot button{background:#034c1f;color:white;border:0;padding:12px 20px;border-radius:9px;cursor:pointer}</style></head><body><main class="boot" role="status"><strong>Quest Intelligence 360</strong><p id="message">Preparing your role-aware intelligence workspace...</p><progress id="progress" max="7" value="0"></progress></main><script>
(async()=>{
  'use strict';
  const RELEASE='20261012persona1';
  const assets=['workspace-experience.js','maci-evidence-model.js','team-workspaces.js','role-access-governance.js','maci-research-center.js','persona-intelligence.js','frontend-critical-nav-survey.js','survey-analytics-dashboard-final.js','survey-analytics-failsafe.js','chart-alignment-system.js','frontend-quality-guard.js','platform-runtime-stability.js','optimized-loader.js','quest-enterprise-insights-override.js','insights-modern-redesign.js','competitive-intelligence-live-refresh/loader.js','alerts-chatgpt-summaries.js'];
  try{
    if(!window.DecompressionStream)throw new Error('Please use a current browser with gzip support.');
    let done=0;
    const chunks=await Promise.all(Array.from({length:7},async(_,i)=>{const r=await fetch('chunks/chunk-'+String(i).padStart(2,'0')+'.txt?v='+RELEASE);if(!r.ok)throw new Error('A workspace file could not be loaded.');const text=await r.text();document.getElementById('progress').value=++done;return text.trim();}));
    const bytes=Uint8Array.from(atob(chunks.join('')),c=>c.charCodeAt(0));
    let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    html=html.replace(/,\s*landscape\s*:\s*['"]Competitive Landscape['"]/i,'').replace(/\s*chart\('positioningBubble'.*?\);\s*/s,'\n').replace(/\s*chart\('capabilityRadar'.*?\);\s*/s,'\n');
    const doc=new DOMParser().parseFromString(html,'text/html');
    doc.documentElement.dataset.questPersonaRelease=RELEASE;
    doc.querySelectorAll('[data-view="landscape"],[data-view-jump="landscape"]').forEach(n=>n.remove());
    doc.querySelectorAll('[data-view="surveys"]').forEach(n=>n.dataset.view='survey');
    for(const id of ['username','password'])doc.getElementById(id)?.setAttribute('value','');
    const tracker=doc.querySelector('.nav-item[data-view="projects"]'),evidence=doc.querySelector('.nav-item[data-view="library"]');if(tracker&&evidence)tracker.after(evidence);
    for(const [route,message] of [['pmr','Loading PMR repository and analysis dashboard...'],['experts','Loading Voice of Experts persona analysis...'],['survey','Loading multi-project Survey Analytics...']]){const view=doc.querySelector('.view[data-view="'+route+'"]');if(view)view.textContent=message;}
    doc.querySelectorAll('script[src]').forEach(s=>{const src=s.getAttribute('src');if(/cdn\.jsdelivr\.net\/npm\/chart\.js/.test(src))s.src='integrations/chart-lite.js?v='+RELEASE;else if(/^(\.\/)?integrations\//.test(src)&&!src.includes('chart-lite.js'))s.remove();});
    for(const file of ['maci-research-center.css','persona-intelligence.css']){const link=doc.createElement('link');link.rel='stylesheet';link.href='integrations/'+file+'?v='+RELEASE;doc.head.append(link);}
    for(const file of assets){const script=doc.createElement('script');script.src='integrations/'+file+'?v='+RELEASE;doc.body.append(script);}
    document.open();document.write('<!doctype html>'+doc.documentElement.outerHTML);document.close();
  }catch(error){document.getElementById('message').textContent=error.message+' Refresh to retry. No data have been changed.';document.getElementById('progress').remove();const b=document.createElement('button');b.textContent='Retry';b.onclick=()=>location.reload();document.querySelector('.boot').append(b);}
})();
</script></body></html>
