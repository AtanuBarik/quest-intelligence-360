<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quest Intelligence 360</title>
  <meta name="theme-color" content="#034c1f">
  <link rel="preconnect" href="https://atanubarik.github.io">
  <style>
    html,body{margin:0;min-height:100%;background:#f3f6f3;font-family:Arial,Helvetica,sans-serif;color:#4f5552}
    .q-boot{min-height:100vh;display:grid;place-items:center;padding:24px}.q-boot-card{width:min(420px,calc(100vw - 40px));padding:24px;border:1px solid #d7e0d8;border-top:4px solid #35792a;border-radius:10px;background:#fff;box-shadow:0 12px 34px rgba(3,76,31,.09)}.q-boot-card strong{display:block;color:#034c1f;font-size:19px}.q-boot-card span{display:block;margin-top:7px;font-size:13px;line-height:1.5}.q-boot-line{height:4px;margin-top:18px;overflow:hidden;border-radius:4px;background:#e7ece7}.q-boot-line i{display:block;width:46%;height:100%;background:linear-gradient(90deg,#034c1f,#35792a,#c6d52f);animation:qboot 1.15s ease-in-out infinite alternate}@keyframes qboot{to{transform:translateX(115%)}}
  </style>
</head>
<body>
  <div class="q-boot"><div class="q-boot-card"><strong>Quest Intelligence 360</strong><span>Loading the optimized dashboard and visual system…</span><div class="q-boot-line"><i></i></div></div></div>
  <script>
  (async()=>{try{
    const release='20260902nav1';
    const shellKey='./.quest-shell-'+release+'.html';
    const scrubText=value=>String(value||'')
      .replace(/ChatGPT/gi,'Insight assistant')
      .replace(/Gemini/gi,'Insight assistant')
      .replace(/\bAI-assisted\b/gi,'assisted')
      .replace(/\bAI-powered\b/gi,'automation-powered')
      .replace(/\bAI-enabled\b/gi,'automation-enabled')
      .replace(/\bAI decision support\b/gi,'decision support')
      .replace(/\bAI analytics\b/gi,'advanced analytics')
      .replace(/\bAI readiness\b/gi,'digital readiness')
      .replace(/\bAI assistant\b/gi,'insights assistant')
      .replace(/\bAI summaries?\b/gi,'automated summaries')
      .replace(/\bAI\b/g,'automation');
    const scrubVisibleTerms=doc=>{
      const walker=doc.createTreeWalker(doc.body||doc.documentElement,NodeFilter.SHOW_TEXT);
      const nodes=[];let node;
      while((node=walker.nextNode())){const p=node.parentElement;if(p&&!p.closest('script,style,noscript,template'))nodes.push(node)}
      nodes.forEach(n=>{const next=scrubText(n.nodeValue);if(next!==n.nodeValue)n.nodeValue=next});
      doc.querySelectorAll('[title],[aria-label],[placeholder],[alt]').forEach(el=>['title','aria-label','placeholder','alt'].forEach(attr=>{if(!el.hasAttribute(attr))return;const current=el.getAttribute(attr)||'',next=scrubText(current);if(next!==current)el.setAttribute(attr,next)}));
    };
    const scrubShell=html=>{try{
      const doc=new DOMParser().parseFromString(html,'text/html');
      const norm=v=>String(v||'').replace(/\s+/g,' ').trim();
      let retiredView='';
      Array.from(doc.querySelectorAll('.nav-item')).forEach(node=>{if(/^competitive landscape$/i.test(norm(node.textContent))){retiredView=node.dataset&&node.dataset.view||retiredView;node.remove()}});
      Array.from(doc.querySelectorAll('.view[data-view]')).forEach(view=>{const heading=Array.from(view.querySelectorAll('h1,h2,h3,[class*=title]')).map(n=>norm(n.textContent)).join(' | ');if((retiredView&&view.dataset.view===retiredView)||view.dataset.view==='landscape'||/competitive landscape/i.test(heading))view.remove()});
      Array.from(doc.querySelectorAll('[aria-label],[title],[data-view-jump="landscape"]')).forEach(node=>{const label=norm(node.getAttribute('aria-label')||node.getAttribute('title'));if(node.dataset?.viewJump==='landscape'||/^competitive landscape$/i.test(label))node.remove()});

      const navItems=Array.from(doc.querySelectorAll('.nav-item'));
      const tracker=navItems.find(node=>/^project tracker$/i.test(norm(node.textContent)));
      const evidence=navItems.find(node=>/^evidence library$/i.test(norm(node.textContent)));
      if(tracker&&evidence&&tracker.parentElement===evidence.parentElement&&tracker.nextElementSibling!==evidence)tracker.insertAdjacentElement('afterend',evidence);

      const pmr=doc.querySelector('.view[data-view="pmr"]')||Array.from(doc.querySelectorAll('.view[data-view]')).find(view=>/PMR Projects\s*&\s*Reports/i.test(norm(view.querySelector('h1')&&view.querySelector('h1').textContent)));
      if(pmr){pmr.dataset.view='pmr';pmr.innerHTML='<div style="padding:28px;border:1px solid #dce6de;border-radius:14px;background:#fff;color:#034c1f;font:600 14px Arial,sans-serif">Loading PMR repository and analysis dashboard…</div>'}
      const experts=doc.querySelector('.view[data-view="experts"]')||Array.from(doc.querySelectorAll('.view[data-view]')).find(view=>/Voice of Experts/i.test(norm(view.querySelector('h1')&&view.querySelector('h1').textContent)));
      if(experts){experts.dataset.view='experts';experts.innerHTML='<div style="padding:28px;border:1px solid #dce6de;border-radius:14px;background:#fff;color:#034c1f;font:600 14px Arial,sans-serif">Loading Voice of Experts persona analysis…</div>'}
      const survey=doc.querySelector('.view[data-view="survey"]')||doc.querySelector('.view[data-view="surveys"]')||Array.from(doc.querySelectorAll('.view[data-view]')).find(view=>/Survey Analytics/i.test(norm(view.querySelector('h1')&&view.querySelector('h1').textContent)));
      if(survey){survey.dataset.view='survey';survey.innerHTML='<div style="padding:28px;border:1px solid #dce6de;border-radius:14px;background:#fff;color:#034c1f;font:600 14px Arial,sans-serif">Loading multi-project Survey Analytics…</div>'}
      const surveyNav=Array.from(doc.querySelectorAll('.nav-item')).find(node=>/^survey analytics$/i.test(norm(node.textContent)));if(surveyNav)surveyNav.dataset.view='survey';
      scrubVisibleTerms(doc);
      return '<!doctype html>'+doc.documentElement.outerHTML;
    }catch(_){return html}};

    let h='';
    if('caches'in window){try{const cache=await caches.open('quest-shell-cache');const keys=await cache.keys();await Promise.all(keys.filter(k=>k.url.includes('.quest-shell-')&&!k.url.includes(release)).map(k=>cache.delete(k)));const hit=await cache.match(shellKey);if(hit)h=await hit.text()}catch(_){}}
    if(!h){
      const files=['chunks/chunk-00.txt','chunks/chunk-01.txt','chunks/chunk-02.txt','chunks/chunk-03.txt','chunks/chunk-04.txt','chunks/chunk-05.txt','chunks/chunk-06.txt'];
      const parts=await Promise.all(files.map(f=>fetch(f+'?v='+release,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));
      const b=atob(parts.join(''));const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);
      const s=new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'));h=await new Response(s).text();
      h=h.replace(/<script\b[^>]*\bsrc=["']https:\/\/cdn\.jsdelivr\.net\/npm\/chart\.js[^"']*["'][^>]*>\s*<\/script>/gi,'<script src="integrations/chart-lite.js?v='+release+'"><\/script>');
      h=h.replace(/<script\b[^>]*\bsrc=["'](?:\.\/)?integrations\/[^"']+["'][^>]*>\s*<\/script>/gi,m=>m.includes('chart-lite.js')?m:'');
      h=scrubShell(h);
      if('caches'in window){try{const cache=await caches.open('quest-shell-cache');await cache.put(shellKey,new Response(h,{headers:{'Content-Type':'text/html;charset=utf-8'}}))}catch(_){}}
    }else h=scrubShell(h);
    const critical='<script src="integrations/frontend-critical-nav-survey.js?v='+release+'"><\/script>';
    const survey='<script src="integrations/survey-analytics-dashboard-final.js?v='+release+'"><\/script>';
    const chartAlign='<script src="integrations/chart-alignment-system.js?v='+release+'"><\/script>';
    const quality='<script src="integrations/frontend-quality-guard.js?v='+release+'"><\/script>';
    const stability='<script src="integrations/platform-runtime-stability.js?v='+release+'"><\/script>';
    const loader='<script src="integrations/optimized-loader.js?v='+release+'"><\/script>';
    const enterpriseInsights='<script src="integrations/quest-enterprise-insights-override.js?v='+release+'"><\/script>';
    h=h.replace('</body>',critical+survey+chartAlign+quality+stability+loader+enterpriseInsights+'</body>');
    document.open();document.write(h);document.close();
  }catch(e){document.body.innerHTML='<div class="q-boot"><div class="q-boot-card"><strong>Unable to load the dashboard</strong><span>Please refresh the page or serve the repository over HTTP. '+String(e.message||e)+'</span></div></div>'}})();
  </script>
</body>
</html>
