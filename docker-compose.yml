services:
  quest-intelligence-360:
    build:
      context: .
      dockerfile: Dockerfile
    image: quest-intelligence-360:latest
    ports:
      - "${QUEST_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q '^ok$'"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
